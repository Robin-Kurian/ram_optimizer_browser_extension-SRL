<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ram Optimizer -SRL</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="assets/lightning-logo.svg" width="39" height="39" alt="">
        <div class="brand-text"><strong>Ram Optimizer -SRL</strong><span>1.0.0</span></div>
      </div>
      <div class="engine-control">
        <span id="engineStatus" class="engine-text">ON</span>
        <label class="switch" title="Auto-freeze"><input id="enabled" type="checkbox" aria-label="Auto-freeze"><span class="track"></span></label>
      </div>
    </header>

    <details class="glass timer-panel">
      <summary><span>Freeze after</span><span class="detail-end"><span id="timerSummary" class="count">—</span><svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7 5 5 5-5" /></svg></span></summary>
      <div class="panel-inner">
        <div class="presets" role="group" aria-label="Freeze timer">
          <button type="button" data-minutes="0">Instant</button>
          <button type="button" data-minutes="0.5">30s</button>
          <button type="button" data-minutes="1">1m</button>
          <button type="button" data-minutes="2">2m</button>
          <button type="button" data-minutes="5">5m</button>
          <button type="button" data-minutes="15">15m</button>
        </div>
      </div>
    </details>

    <details class="glass resources" open>
      <summary><span class="usage-collapsed">Usage</span><span class="usage-expanded">System Usage</span><span class="detail-end"><span class="count"><span id="ramSummary">RAM —</span> · <span id="cpuSummary">CPU —</span></span><svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7 5 5 5-5" /></svg></span></summary>
      <div class="panel-inner">
        <div class="memory-stats">
          <div class="memory-stat"><span id="ramPrimaryLabel">RAM used</span><strong id="ramPrimary">—</strong></div>
          <div class="memory-stat"><span>Free RAM</span><strong id="ramFree">—</strong><small id="ramFreeFraction" class="memory-fraction" aria-label="Free RAM out of total RAM">—</small></div>
        </div>
        <div class="cpu-line"><span>CPU</span><strong id="cpuValue">—</strong></div>
        <div class="meter"><span id="cpuBar"></span></div>
      </div>
    </details>

    <details class="glass tab-panel">
      <summary><span>Tab status</span><span class="detail-end"><span id="tabsSummary" class="count">—</span><svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7 5 5 5-5" /></svg></span></summary>
      <div class="panel-inner">
        <div class="tab-stats">
          <div><strong id="tabsOpen">—</strong><span>Open</span></div>
          <div><strong id="tabsLoaded">—</strong><span>Loaded</span></div>
          <div><strong id="tabsFrozen">—</strong><span>Frozen</span></div>
        </div>
        <button type="button" id="freezeNow" class="text-button">Freeze now</button>
      </div>
    </details>

    <details id="protection" class="glass preferences" open>
      <summary><span>Protection &amp; excluded websites</span><span class="detail-end"><span id="protectionCount" class="count">—</span><svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7 5 5 5-5" /></svg></span></summary>
      <div class="preferences-inner">
        <label class="setting"><span>Protect pinned tabs</span><input id="protectPinned" type="checkbox"></label>
        <label class="setting"><span>Protect audio tabs</span><input id="protectAudio" type="checkbox"></label>
        <label class="setting"><span>Frozen tab group</span><input id="groupFrozen" type="checkbox"></label>
        <label class="setting"><span>High-memory alerts</span><input id="memoryAlerts" type="checkbox"></label>
        <section class="excluded-section" aria-labelledby="excludedTitle">
          <div class="extension-header">
            <span id="excludedTitle">Excluded websites</span>
            <button type="button" id="addExcluded" class="text-button" aria-label="Add current website">+ Add</button>
          </div>
          <ul id="excluded" aria-labelledby="excludedTitle"></ul>
        </section>
        <div class="extension-header"><span>Extensions</span><span id="pausedCount" class="subtle-count"></span></div>
        <div id="extensionChoices" class="extension-choices" aria-label="Manage extensions"></div>
      </div>
    </details>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
